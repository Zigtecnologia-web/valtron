name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--bundles app,dmg"
          - platform: windows-latest
            args: "--bundles nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Publicar build Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Valtron ${{ github.ref_name }}"
          releaseBody: "Veja os arquivos desta versao para baixar e instalar o Valtron."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  normalize-latest-json:
    needs: publish-tauri
    runs-on: ubuntu-latest

    steps:
      - name: Corrigir URLs do updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir /tmp/valtron-release \
            --clobber

          gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            > /tmp/valtron-release/assets.json

          jq --slurpfile assets /tmp/valtron-release/assets.json '
            .platforms |= with_entries(
              .value.url as $current_url
              | if ($current_url | startswith("https://api.github.com/")) then
                  ($assets[0].assets[]
                    | select(.apiUrl == $current_url)
                    | .url) as $download_url
                  | .value.url = $download_url
                else
                  .
                end
            )
          ' /tmp/valtron-release/latest.json > /tmp/valtron-release/latest.fixed.json

          mv /tmp/valtron-release/latest.fixed.json /tmp/valtron-release/latest.json

          gh release upload "$TAG_NAME" \
            /tmp/valtron-release/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
