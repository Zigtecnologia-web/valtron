[package]
name = "valtron"
version = "0.1.0"
description = "Aplicativo desktop Valtron"
authors = ["Valtron"]
edition = "2021"

[lib]
name = "valtron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.36.1"
duckdb = { version = "1.10505.0", features = ["bundled", "appender-arrow"] }
tauri-plugin-dialog = "2.7.2"
libc = "0.2"
quick-xml = "0.41.0"
zip = "8.6.0"
